name: Audio pipeline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Fail when no test ran: node --test exits 0 if the glob matches nothing.
      # Summary line is "# tests N" (TAP) or "ℹ tests N" (spec).
      - name: Run tests
        shell: bash
        run: |
          npm test 2>&1 | tee test-output.txt
          if ! grep -Eq '^(#|ℹ) tests [1-9]' test-output.txt; then
            echo "::error::No tests were run. Check the test file names in tests/."
            exit 1
          fi

name: Audio pipeline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Fail when no test ran: node --test exits 0 if the glob matches nothing.
      # Summary line is "# tests N" (TAP) or "ℹ tests N" (spec).
      - name: Run tests
        shell: bash
        run: |
          npm test 2>&1 | tee test-output.txt
          if ! grep -Eq '^(#|ℹ) tests [1-9]' test-output.txt; then
            echo "::error::No tests were run. Check the test file names in tests/."
            exit 1
          fi

  ffmpeg:
    uses: ./.github/workflows/ffmpeg.yml

  sox:
    uses: ./.github/workflows/sox.yml

  rust:
    # Converter tests run real conversions with the FFmpeg and SoX that ship with the app.
    needs: [ffmpeg, sox]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, ffmpeg: macos-arm64 }
          - { os: windows-latest, ffmpeg: windows-x64 }
          - { os: ubuntu-22.04, ffmpeg: linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-${{ matrix.ffmpeg }}
          path: ${{ runner.temp }}/ffmpeg
      - name: Use the built FFmpeg
        shell: bash
        run: |
          bin="$(ls "$RUNNER_TEMP"/ffmpeg/bin/ffmpeg*)"
          chmod +x "$bin" # artifacts do not keep the executable bit
          echo "FFMPEG_BUNDLE_SOURCE=$bin" >> "$GITHUB_ENV"
          echo "FFMPEG_BUNDLE_LICENSE=$RUNNER_TEMP/ffmpeg/FFMPEG-LICENSE.txt" >> "$GITHUB_ENV"
          echo "FFMPEG_PATH=$bin" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: sox-${{ matrix.ffmpeg }}
          path: ${{ runner.temp }}/sox
      - name: Use the built SoX
        shell: bash
        run: |
          bin="$(ls "$RUNNER_TEMP"/sox/bin/sox*)"
          chmod +x "$bin"
          echo "SOX_BUNDLE_SOURCE=$bin" >> "$GITHUB_ENV"
          echo "SOX_BUNDLE_LICENSE=$RUNNER_TEMP/sox/SOX-LICENSE.txt" >> "$GITHUB_ENV"
          echo "SOX_PATH=$bin" >> "$GITHUB_ENV"
      # postinstall copies FFMPEG_BUNDLE_SOURCE and SOX_BUNDLE_SOURCE to src-tauri/binaries
      # (the Tauri build needs them).
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Run Rust tests
        shell: bash
        run: |
          # Fail (not skip) the FFmpeg tests if FFmpeg cannot run.
          export REQUIRE_FFMPEG=1
          cd src-tauri
          cargo test --lib

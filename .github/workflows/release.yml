name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the release and upload assets

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon; macos-15-intel builds for Intel Macs.
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-22.04]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # The npm ffmpeg-static binary for macOS is a --enable-nonfree build that may not
      # be redistributed, so macOS bundles an LGPL FFmpeg built from source.
      - name: Cache macOS FFmpeg build
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg-macos
          key: ffmpeg-macos-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg-macos.sh') }}

      # FFmpeg's x86 assembly needs nasm (build tool only, not shipped).
      - name: Install nasm (Intel macOS)
        if: runner.os == 'macOS' && runner.arch == 'X64'
        run: brew install nasm

      - name: Build redistributable FFmpeg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: scripts/build-ffmpeg-macos.sh "$RUNNER_TEMP/ffmpeg-macos" | tail -n 2 >> "$GITHUB_ENV"

      # Release mode: fails if the FFmpeg to bundle lacks an encoder or was built
      # with --enable-nonfree. FFMPEG_BUNDLE_SOURCE (set above on macOS) overrides.
      - name: Prepare bundled FFmpeg
        run: node scripts/prepare-ffmpeg.mjs --release

      - name: Build app
        run: npm run build

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

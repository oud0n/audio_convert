name: Build and Release

on:
  push:
    tags:
      - 'v*' # v1.0.0 などのタグがプッシュされたときにトリガー

permissions:
  contents: write # リリース作成とアセットアップロードに書き込み権限が必要

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and Package Electron App
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            dist/Audio Converter Setup *.exe
            dist/Audio Converter Setup *.exe.blockmap
            dist/Audio Converter-*.zip
            dist/Audio Converter-*.dmg
            dist/Audio Converter-*.AppImage
            dist/Audio Converter-*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

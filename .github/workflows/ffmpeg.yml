name: FFmpeg

# Builds the FFmpeg that ships with the app (LGPL, scripts/build-ffmpeg.sh) on every
# platform and uploads it as the artifact "ffmpeg-<name>" (bin/ffmpeg[.exe] and
# FFMPEG-LICENSE.txt). Called by the test and release workflows. Builds are cached
# by the script's hash, so FFmpeg is only rebuilt when the script changes.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: FFmpeg ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest }
          - { name: macos-x64, os: macos-15-intel }
          - { name: linux-x64, os: ubuntu-22.04 }
          - { name: windows-x64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore cached build
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-${{ matrix.name }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Install build tools (Intel macOS)
        if: steps.cache.outputs.cache-hit != 'true' && matrix.name == 'macos-x64'
        run: brew install nasm

      - name: Install build tools (Linux)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm zlib1g-dev

      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            make diffutils tar curl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-zlib

      - name: Build FFmpeg
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/build-ffmpeg.sh "$RUNNER_TEMP/ffmpeg" | tail -n 2 >> "$GITHUB_ENV"

      - name: Build FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -o pipefail
          scripts/build-ffmpeg.sh "$(cygpath -u "$RUNNER_TEMP")/ffmpeg" | tail -n 2 >> "$(cygpath -u "$GITHUB_ENV")"

      # Same checks as a release: required encoders present, no --enable-nonfree.
      - name: Check the build
        shell: bash
        run: node scripts/prepare-ffmpeg.mjs --release

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.name }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/ffmpeg/out/bin/ffmpeg*
            ${{ runner.temp }}/ffmpeg/out/FFMPEG-LICENSE.txt
